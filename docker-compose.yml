# Short-URL + MySQL. Usage:
#   cp .env.example .env   (set DB_PASSWORD, API_KEY, SHORT_DOMAIN)
#   docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shorturl}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
    ports:
      - "${PORT:-3000}:3000"
    command: ["sh", "-c", "node scripts/migrate.js && node src/index.js"]

volumes:
  db_data:
